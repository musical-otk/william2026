<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SELFTEST</title>
<style>
  body{font-family:'Apple SD Gothic Neo',sans-serif;max-width:820px;margin:0 auto;padding:20px;background:#F2F7F6;color:#16302F;}
  h1{font-size:18px;margin:0 0 4px;}
  .sub{font-size:12px;color:#4A6B69;margin-bottom:14px;}
  #summary{font-weight:700;font-size:15px;padding:10px 14px;border-radius:10px;margin-bottom:12px;}
  .ok{background:#DFF3EA;color:#12603F;}
  .bad{background:#FBE3E3;color:#8C2020;}
  .grp{font-weight:700;font-size:13px;margin:14px 0 6px;color:#12525A;}
  .row{display:flex;gap:8px;padding:5px 8px;border-bottom:1px solid #D7E4E2;font-size:13px;align-items:flex-start;}
  .tag{flex-shrink:0;width:52px;font-weight:700;}
  .p{color:#12603F;} .f{color:#8C2020;}
  .name{flex:1;}
  .detail{font-size:11px;color:#8C2020;white-space:pre-wrap;}
  iframe{width:1px;height:1px;opacity:0;position:absolute;pointer-events:none;}
</style>
</head>
<body>
<h1>📜 윌리엄들 관극 다이어리 — 셀프 검사</h1>
<div class="sub">index.html 을 iframe 으로 실제 로드해 내부 상태를 직접 검증합니다. (TEST_PLAN.md L2 계층)</div>
<div id="summary">실행 중…</div>
<div id="results"></div>
<iframe id="app" src="./index.html"></iframe>

<script>
const results = [];
let W = null;

function t(group, name, fn) { results.push({ group, name, fn }); }
function eq(a, b, msg) {
  const A = JSON.stringify(a), B = JSON.stringify(b);
  if (A !== B) throw new Error((msg ? msg + ' — ' : '') + `기대 ${B}, 실제 ${A}`);
}
function ok(cond, msg) { if (!cond) throw new Error(msg || '조건 실패'); }

// 최상위 const/let 은 window 속성이 되지 않으므로 iframe 스코프에서 eval 로 읽는다
const g = n => W.eval(n);

// 시나리오마다 저장소를 비워 순서 의존성을 없앤다.
// 단, fetch 로 받아온 schedule/events 는 남긴다 (지우면 이후 데이터 검사가 깨진다)
const KEEP = ['william_schedule', 'william_events'];
function reset() {
  const ls = W.localStorage;
  Object.keys(ls)
    .filter(k => k.startsWith('william_') && !KEEP.includes(k))
    .forEach(k => ls.removeItem(k));
}
function boards() { return W.getStampBoards(); }
function newBoard(name) {
  const bs = boards();
  const b = { id: W.uuid(), name: String(name), totalSlots: g('DEFAULT_SLOTS'),
              milestones: W.defaultMilestones(), currentCount: 0, history: [] };
  bs.push(b); W.saveStampBoards(bs);
  return b.id;
}
function countOf(id) { const b = boards().find(x => x.id === id); return b ? b.currentCount : null; }
function fill(id, n) { W.applyStampToBoard(id, n, '2026-12-08', '테스트'); W.applyStampToBoard._lastOverflow = 0; }
function coupon40() { return W.calcCouponCount('discount40', W.getCoupons(), boards(), W.getRecords()); }

// 스케줄에서 확실히 1회차뿐인 날 (개막일 화요일 20:00) / 40% 할인권 사용기간 안의 1회차 날
const D1 = '2026-12-08', T1 = '20:00';
const D2 = '2026-12-15', T2 = '20:00';
const span = z => z ? (z[1] - z[0] + 1) : 0;
const rowSeats = d => d.merged ? span(d.merged) : span(d.l) + span(d.m) + span(d.r);

// ── E. 개조 정합성 ────────────────────────────────────
t('E. 개조 정합성', 'ROLES 가 사무엘·H·헨리', () => {
  eq(g('ROLES').map(r => r.key), ['samuel','h','henry']);
  eq(g('ROLES').map(r => r.label), ['사무엘','H','헨리']);
});
t('E. 개조 정합성', '배우 3·3·4명 · 10명', () => {
  eq(g('ROLES').map(r => r.actors.length), [3, 3, 4]);
  const all = g('ROLES').flatMap(r => r.actors);
  eq(new Set(all).size, 10, '배우 중복 없음');
});
t('E. 개조 정합성', '기록 폼에 배역 입력 3개 존재 · 배우 옵션 일치', () => {
  const d = W.document;
  g('ROLES').forEach(r => {
    const el = d.getElementById('rec-' + r.key);
    ok(el, `#rec-${r.key} 없음`);
    eq([...el.options].map(o => o.value).filter(Boolean), r.actors, r.label + ' 옵션');
  });
});
t('E. 개조 정합성', '이전 작품 배역 입력이 남아있지 않음', () => {
  const d = W.document;
  ['achilles','patroclus','hector','marco','soma','yuo','uiju','eunhui'].forEach(k =>
    ok(!d.getElementById('rec-' + k), `이전 작품 배역 입력 #rec-${k} 잔존`));
});
t('E. 개조 정합성', '저장소 네임스페이스가 william_', () => {
  eq(g('APP_PREFIX'), 'william_');
});
t('E. 개조 정합성', '배역 라벨 폭이 가장 긴 배역명에 맞춰져 있다', () => {
  const longest = Math.max(...g('ROLES').map(r => r.label.length));
  eq(W.roleLabelWidth(), `calc(${longest}em + 2px)`, "'전체' 칩 시작 위치가 어긋나면 안 됨");
  eq(longest, 3, '사무엘이 가장 길다');
});
t('E. 개조 정합성', '시간 선택지가 스케줄의 모든 시간을 담는다', () => {
  const W0 = W.document.getElementById('rec-time');
  W.resetTimeOptions();
  const opts = [...W0.options].map(o => o.value).filter(Boolean);
  [...new Set(W.getSchedule().map(s => s.time))].forEach(tm => ok(opts.includes(tm), tm + ' 누락'));
});

// ── U. 좌석 ───────────────────────────────────────────
t('U. 좌석', '단층 A~R', () => {
  eq(Object.keys(g('SEAT_PLAN')), ['1층'], '층이 하나여야 함');
  eq(g('SEAT_PLAN')['1층'].rows, 'ABCDEFGHIJKLMNOPQR'.split(''));
});
t('U. 좌석', '좌석 합계 = 판독 334석', () => {
  const P = g('SEAT_PLAN')['1층'];
  eq(P.rows.reduce((s, r) => s + rowSeats(P.def[r]), 0), 334, '단층 총계');
});
t('U. 좌석', '판매보류 11석 · 실판매 323석', () => {
  const n = Object.values(g('SEAT_UNAVAILABLE')['1층']).reduce((s, a) => s + a.length, 0);
  eq(n, 11, '판매보류석');
  eq(334 - n, 323, '실판매');
});
t('U. 좌석', '판매보류석이 모두 실제 좌석 범위 안', () => {
  const plan = g('SEAT_PLAN')['1층'], blocked = g('SEAT_UNAVAILABLE')['1층'];
  Object.entries(blocked).forEach(([row, nums]) => {
    const d = plan.def[row];
    ok(d, `${row}열이 SEAT_PLAN 에 없음`);
    const inRange = n => [d.merged, d.l, d.m, d.r].some(z => z && n >= z[0] && n <= z[1]);
    nums.forEach(n => ok(inRange(n), `${row}열 ${n}번이 좌석 범위 밖`));
  });
});
t('U. 좌석', '열별 번호 판독값 (불규칙 열)', () => {
  const D = g('SEAT_PLAN')['1층'].def;
  eq(D.B.merged, [1, 19], 'B열 19석');
  eq([D.F.l, D.F.m, D.F.r], [[1,2],[3,14],[15,16]], 'F열');
  eq([D.Q.l, D.Q.m, D.Q.r], [[1,4],[6,16],[17,20]], 'Q열 — 5번 없음');
  eq([D.R.l, D.R.m, D.R.r], [[1,4], null, [5,8]], 'R열 — 우측이 5~8');
  eq(W.rowMaxNum('1층', 'R'), 8);
  eq(W.rowMaxNum('1층', 'A'), 20);
});
t('U. 좌석', '정렬 기준(FLOOR_ZONES)이 모든 열을 담을 수 있음', () => {
  const Z = g('FLOOR_ZONES')['1층'];
  g('SEAT_PLAN')['1층'].rows.forEach(r => {
    const d = g('SEAT_PLAN')['1층'].def[r];
    if (d.merged) { ok(span(d.merged) <= Z.l + Z.m + Z.r, `${r}열 한 줄 ${span(d.merged)}석이 전체 폭 초과`); return; }
    ok(span(d.l) <= Z.l, `${r}열 좌구역 ${span(d.l)} > 기준 ${Z.l}`);
    ok(span(d.m) <= Z.m, `${r}열 중구역 ${span(d.m)} > 기준 ${Z.m}`);
    ok(span(d.r) <= Z.r, `${r}열 우구역 ${span(d.r)} > 기준 ${Z.r}`);
  });
});
t('U. 좌석', '한 줄 열(A~E)은 가운데 정렬 — B 는 반 칸 들어감', () => {
  const C = 11, G = 1, ZG = 11;
  const a = W.mergedLeadPx('1층', [1, 20], C, G, ZG), b = W.mergedLeadPx('1층', [1, 19], C, G, ZG);
  eq(a, ZG, '20석 줄은 구역 간격 2개를 반씩 나눈 만큼 들어간다');
  ok(b > a && b - a <= (C + G) / 2 + 1, `B열 여백 ${b} 은 A열 ${a} 보다 반 칸 커야 함`);
});
t('U. 좌석', '히트맵과 미니 좌석도가 같은 칸 수를 그린다', () => {
  W.renderHeatmap();
  const hm = W.document.getElementById('heatmap');
  eq(hm.querySelectorAll('.hm-cell').length, 323, '히트맵 판매 좌석 칸 수');
  const mini = W.buildMiniSeat('1층', 'Q', 6);
  const host = W.document.createElement('div'); host.innerHTML = mini;
  ok(/box-shadow/.test(mini), 'Q6 이 강조돼야 함');
});
t('U. 좌석', '좌석 입력 드롭다운(FLOOR_ROWS)이 좌석도와 일치', () => {
  eq(Object.keys(g('FLOOR_ROWS')), ['1층']);
  eq(g('FLOOR_ROWS')['1층'], g('SEAT_PLAN')['1층'].rows, 'FLOOR_ROWS 와 SEAT_PLAN 이 어긋남');
});
t('U. 좌석', '공식 좌석도와 같은 자리에서 행이 끊긴다 (E·J 다음)', () => {
  eq(g('SEAT_PLAN')['1층'].gapAfter, ['E', 'J'], '공식 좌석도의 행 간격');
});

// ── S. 도장판 (재관람카드) ────────────────────────────
t('S. 도장판', '7칸 · 마일스톤 3·5·7회 (선택지 없음)', () => {
  const ms = W.defaultMilestones();
  eq(ms.map(m => m.at), [3, 5, 7]);
  eq(g('DEFAULT_SLOTS'), 7, '도장판은 7칸');
  eq(ms[ms.length - 1].at, g('DEFAULT_SLOTS'), '마지막 마일스톤이 마지막 칸이어야 함');
  ms.forEach(m => ok(m.choiceRequired === undefined, '보상 선택이 없어야 함'));
});
t('S. 도장판', '3회 보상만 40% 할인권 2매에 연결', () => {
  const ms = W.defaultMilestones();
  eq([ms[0].couponKey, ms[0].qty], ['discount40', 2]);
  eq([ms[1].couponKey, ms[2].couponKey], [null, null], '폴라로이드·OST 는 실물 굿즈');
});
t('S. 도장판', '이전 체계(3·7회 등) 판은 3·5·7회로 교체 — 지급 이력 유지', () => {
  const old = [{ id: 'x', name: '1', totalSlots: 7, currentCount: 3, history: [],
                 milestones: [{ at: 3, reward: 'old', couponKey: null, notified: true },
                              { at: 7, reward: 'old', couponKey: null, notified: false }] }];
  const m = W.migrateStampBoards(old)[0].milestones;
  eq(m.map(x => x.at), [3, 5, 7]);
  eq(m.map(x => x.notified), [true, false, false]);
});
t('S. 도장판', 'S8 — 잔여 충분하면 같은 판에 2개', () => {
  reset();
  const id = newBoard(1);
  fill(id, 3);
  W.applyStampToBoard(id, 2, '2026-12-09', '2매');
  eq(W.applyStampToBoard._lastOverflow, 0, '초과분 없어야 함');
  eq(countOf(id), 5);
  eq(boards().length, 1, '새 판이 생기면 안 됨');
});
t('S. 도장판', 'S1 — 잔여 1칸 + 2개 적립 → 초과 1개는 새 판으로', () => {
  reset();
  const id = newBoard(1);
  fill(id, 6);
  W.applyStampToBoard(id, 2, '2026-12-09', '2매');
  const over = W.applyStampToBoard._lastOverflow;
  eq(over, 1, '초과분');
  eq(countOf(id), 7, '기존 판은 가득 참');
  W.createOverflowBoard(over, '2026-12-09', '2매', '', null);
  eq(boards().length, 2, '새 판 1개 생성');
  const nb = boards().find(b => b.id !== id);
  eq(nb.currentCount, 1, '새 판에 초과분 1개');
  eq(nb.totalSlots, 7, '새 판도 7칸');
});
t('S. 도장판', 'S9 — 초과분이 기존 미완성 판으로 가면 안 됨 (합산 불가)', () => {
  reset();
  const a = newBoard(1), b = newBoard(2);
  fill(b, 3);
  fill(a, 6);
  W.applyStampToBoard(a, 2, '2026-12-09', '2매');
  const over = W.applyStampToBoard._lastOverflow;
  eq(over, 1);
  W.createOverflowBoard(over, '2026-12-09', '2매', '', null);
  eq(countOf(b), 3, '기존 미완성 판은 그대로여야 함 (서로 다른 카드 합산 불가)');
  eq(boards().length, 3, '새 판이 추가로 생성돼야 함');
});
t('S. 도장판', 'S2 — 가득 찬 판에는 더 못 찍음', () => {
  reset();
  const id = newBoard(1);
  fill(id, 7);
  const msg = W.applyStampToBoard(id, 1, '2026-12-10', '테스트');
  ok(/이미 완성/.test(msg || ''), '완성 안내가 나와야 함: ' + msg);
  eq(countOf(id), 7);
});
t('S. 도장판', 'S3 — 3·5·7회에서 보상 발동', () => {
  reset();
  const id = newBoard(1);
  const at = n => boards().find(x => x.id === id).milestones.find(m => m.at === n).notified;
  const st = () => [at(3), at(5), at(7)];
  fill(id, 2); eq(st(), [false, false, false], '2회');
  fill(id, 1); eq(st(), [true,  false, false], '3회');
  fill(id, 1); eq(st(), [true,  false, false], '4회');
  fill(id, 1); eq(st(), [true,  true,  false], '5회');
  fill(id, 2); eq(st(), [true,  true,  true ], '7회');
});

// ── K. 40% 할인권 ─────────────────────────────────────
t('K. 할인권', '도장 3개 → 40% 할인권 2매', () => {
  reset();
  const id = newBoard(1);
  fill(id, 2); eq(coupon40(), 0, '2회');
  fill(id, 1); eq(coupon40(), 2, '3회 달성 시 2매');
  fill(id, 4); eq(coupon40(), 2, '5·7회 보상은 쿠폰이 아님');
});
t('K. 할인권', '할인권으로 예매 기록 → 1매 차감, 기록 삭제 → 복구', () => {
  reset();
  const id = newBoard(1);
  fill(id, 3);
  const recs = addRecordViaForm({ date: D2, time: T2, discount: '재관람카드 40% 할인권' });
  eq(recs.length, 1, '저장돼야 함');
  eq(coupon40(), 1, '1매 차감');
  deleteRecordById(recs[0].id);
  eq(coupon40(), 2, '삭제하면 복구');
});
t('K. 할인권', '보유 0매면 할인권 기록이 막힌다', () => {
  reset();
  const recs = addRecordViaForm({ date: D2, time: T2, discount: '재관람카드 40% 할인권' });
  eq(recs.length, 0, '쿠폰이 없으면 저장되면 안 됨');
});
t('K. 할인권', '차액 지불이면 할인권을 차감하지 않음', () => {
  reset();
  const id = newBoard(1);
  fill(id, 3);
  const recs = addRecordViaForm({ date: D2, time: T2, discount: '재관람카드 40% 할인권', paidDiff: true });
  eq(recs[0].paidDiff, true);
  eq(coupon40(), 2, '차액 지불 건은 차감 제외');
});
t('K. 할인권', '양도한 회차의 할인권은 돌아온다', () => {
  reset();
  const id = newBoard(1);
  fill(id, 3);
  addRecordViaForm({ date: D2, time: T2, discount: '재관람카드 40% 할인권' });
  eq(coupon40(), 1);
  const rs = W.getRecords(); rs[0].status = g('ST_TRANSFERRED'); W.saveRecords(rs);
  eq(coupon40(), 2, '양도는 사용으로 치지 않음');
});
t('K. 할인권', '쿠폰 현황은 펼친 채 시작하고 40% 카드가 보인다', () => {
  reset();
  W.renderCouponList();
  eq(W.document.getElementById('coupon-wrap').style.display, '', '쿠폰이 있는 작품이므로 펼침');
  ok(/40% 실물 할인권/.test(W.document.getElementById('coupon-list').innerHTML), '40% 카드');
});

// ── R. 기록 생명주기 ──────────────────────────────────
// 폼을 실제로 조작해 saveRecord / deleteCurrentRecord 경로를 그대로 태운다
function addRecordViaForm({ date, time, cast = {}, boardId = '', discount = '', paidDiff = false }) {
  const d = W.document;
  W.openAddRecord(date);
  d.getElementById('rec-time').value = time;
  // openAddRecord(date) 는 스케줄에서 캐스팅을 자동 입력한다.
  // 테스트는 의도한 값만 남기려고 전부 비운 뒤 cast 를 적용한다.
  g('ROLES').forEach(r => { d.getElementById('rec-' + r.key).value = ''; });
  Object.entries(cast).forEach(([k, v]) => { d.getElementById('rec-' + k).value = v; });
  if (discount) {
    d.getElementById('rec-discount-type').value = discount;
    ok(d.getElementById('rec-discount-type').value === discount, '할인권종 목록에 없음: ' + discount);
    W.onDiscountTypeChange();
  }
  if (paidDiff) d.getElementById('rec-paid-diff').checked = true;
  if (boardId) {
    const sel = d.getElementById('rec-stamp-board');
    sel.value = boardId;
    ok(sel.value === boardId, '도장판 선택 실패 — 목록에 없음');
    W.onRecStampBoardChange();
  }
  W.saveRecord();
  return W.getRecords();
}
function deleteRecordById(id) {
  W.confirm = () => true;                       // 삭제 확인만 승인
  W.eval('currentDetailId = ' + JSON.stringify(id));
  W.deleteCurrentRecord();
  W.confirm = () => false;                      // 기본값으로 복귀
}

t('R. 기록', 'R1 — 기록 삭제 시 도장도 회수', () => {
  reset();
  const id = newBoard(1);
  fill(id, 2);
  const before = countOf(id);
  const recs = addRecordViaForm({ date: D1, time: T1, cast: { samuel: '원종환', h: '김지철' }, boardId: id });
  eq(recs.length, 1, '기록 저장');
  eq(countOf(id), before + 1, '도장 1개 적립');
  deleteRecordById(recs[0].id);

// ── 실행 ──────────────────────────────────────────────
function run() {
  let pass = 0, fail = 0;
  const out = document.getElementById('results');
  let lastGroup = null;
  results.forEach(r => {
    if (r.group !== lastGroup) {
      const gEl = document.createElement('div');
      gEl.className = 'grp'; gEl.textContent = r.group;
      out.appendChild(gEl); lastGroup = r.group;
    }
    let err = null;
    try { r.fn(); pass++; } catch (e) { err = e.message || String(e); fail++; }
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="tag ${err ? 'f' : 'p'}">${err ? 'FAIL' : 'PASS'}</span>`
                  + `<span class="name">${r.name}${err ? `<div class="detail">${err}</div>` : ''}</span>`;
    out.appendChild(row);
  });
  const sum = document.getElementById('summary');
  sum.className = fail ? 'bad' : 'ok';
  sum.textContent = `RESULT ${pass} passed, ${fail} failed`;
  document.title = `SELFTEST ${pass} passed ${fail} failed`;
}

const frame = document.getElementById('app');
frame.addEventListener('load', () => {
  W = frame.contentWindow;
  // schedule.json / events.json fetch 가 끝날 시간을 준다
  const start = Date.now();
  (function wait() {
    const ready = W.getSchedule && W.getSchedule().length > 0;
    if (ready || Date.now() - start > 6000) {
      // headless 에는 confirm 에 답할 사람이 없어 영원히 멈춘다. 기본 거절로 스텁한다.
      // (COUPON_PACKS 가 비어 쿠폰팩 confirm 은 안 뜨지만, 삭제 확인 등이 있다)
      W.confirm = () => false;
      W.alert   = () => {};
      run();
    } else setTimeout(wait, 150);
  })();
});
